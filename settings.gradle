pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'manascore'

["animation", "attribute", "command", "config", "inventory", "keybind", "network", "race", "storage", "testing", "skill"].forEach { module ->
    include ":$module-common"
    include ":$module-fabric"
    include ":$module-neoforge"
}

include ":architectury-common"
include ":architectury-neoforge"

include ':bundle-fabric'
include ':bundle-neoforge'

