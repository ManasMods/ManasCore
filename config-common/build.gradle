loom {
    accessWidenerPath = file('src/main/resources/manascore_config.accesswidener')
}

dependencies {
    implementation "com.electronwill.night-config:core:3.8.1"
    implementation "com.electronwill.night-config:toml:3.8.1"
    implementation(project(path: ":network-common", configuration: 'namedElements')) { transitive false }

    testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}